<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ApplyAI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="login-page">
        <div class="login-container">
            <!-- Left Section -->
            <div class="login-left">
                <a href="login.html" class="back-home">
                    <i class="fas fa-arrow-left"></i>
                    Back to Login
                </a>

                <a href="../index.html" class="logo">
                    <h2>ApplyAI</h2>
                </a>

                <h1>Reset Password 🔑</h1>
                <p>
                    Choose a strong, secure new password for your account. Make sure it contains uppercase and lowercase letters, numbers, and special characters.
                </p>

                <div class="login-illustration" style="margin-top: 50px;">
                    <i class="fa-solid fa-key" style="font-size: 120px; color: rgba(255,255,255,0.15);"></i>
                </div>
            </div>

            <!-- Right Section -->
            <div class="login-right">
                <div class="login-card">
                    <h2>New Password</h2>
                    <p>Enter and confirm your new password below.</p>

                    <form id="resetForm">
                        <!-- Password -->
                        <div class="input-group">
                            <label for="password">New Password</label>
                            <div class="password-field">
                                <input type="password" id="password" placeholder="Enter new password" required minlength="8">
                                <i class="fas fa-eye toggle-password"></i>
                            </div>
                            <small class="error-message"></small>
                        </div>

                        <!-- Confirm Password -->
                        <div class="input-group" style="margin-top: 15px;">
                            <label for="confirmPassword">Confirm Password</label>
                            <div class="password-field">
                                <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="8">
                                <i class="fas fa-eye toggle-password"></i>
                            </div>
                            <small class="error-message"></small>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="login-btn-full" style="margin-top: 20px;">
                            Save New Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Theme -->
    <script src="../js/config.js"></script>
    <script src="../js/theme.js"></script>
    <!-- Reset Password logic -->
    <script src="../js/reset-password.js"></script>
</body>
</html>
